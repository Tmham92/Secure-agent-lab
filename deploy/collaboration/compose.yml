x-app: &app
  build:
    context: ../..
    dockerfile: deploy/collaboration/Dockerfile
  network_mode: service:boundary
  depends_on:
    boundary: {condition: service_healthy}
  cap_drop: [ALL]
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  pids_limit: 64
  mem_limit: 192m
  cpus: 0.5
services:
  boundary:
    build:
      context: ../..
      dockerfile: deploy/isolation/Boundary.Dockerfile
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: ["/ready:size=1m,mode=0755"]
    networks: [sealed]
    pids_limit: 8
    mem_limit: 32m
    cpus: 0.25
    healthcheck:
      test: [CMD, test, -f, /ready/installed]
      interval: 1s
      timeout: 1s
      retries: 20
  broker:
    <<: *app
    user: "1656:1656"
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5188
      Collaboration_Mode: broker
      Collaboration_LoopbackHttp: "true"
      Collaboration_CredentialKey: ${COLLAB_BROKER_KEY:?generated by script}
      Collaboration_PrivateKey: ${COLLAB_PRIVATE_KEY:?generated by script}
  evaluator:
    <<: *app
    user: "1656:1656"
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5190
      Collaboration_Mode: evaluator
      Collaboration_LoopbackHttp: "true"
      Collaboration_CredentialKey: ${COLLAB_EVAL_KEY:?generated by script}
      Collaboration_PublicKey: ${COLLAB_PUBLIC_KEY:?generated by script}
      Collaboration_ExpectedAnswer: "42"
  relay:
    image: nginx:1.28-alpine
    network_mode: service:boundary
    depends_on:
      boundary: {condition: service_healthy}
    user: "1655:1655"
    entrypoint: [nginx, -g, "daemon off;"]
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.25
  researcher:
    <<: *app
    user: "1654:1654"
    command: [--container-agent, idle]
    tmpfs: ["/tmp:size=8m,mode=1777", "/workspace:size=8m,mode=0700,uid=1654,gid=1654"]
    environment:
      COLLAB_WORKER_TOKEN: ${COLLAB_RESEARCHER_TOKEN:-}
  writer:
    <<: *app
    user: "1654:1654"
    command: [--container-agent, idle]
    tmpfs: ["/tmp:size=8m,mode=1777", "/workspace:size=8m,mode=0700,uid=1654,gid=1654"]
    environment:
      COLLAB_WORKER_TOKEN: ${COLLAB_WRITER_TOKEN:-}
networks:
  sealed:
    internal: true
