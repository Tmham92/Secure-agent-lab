pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    # Nginx initializes these module paths even though the relay only proxies HTTP.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 16k;
    limit_req_zone $binary_remote_addr zone=proposals:1m rate=10r/s;
    server {
        listen 127.0.0.1:8080;
        location = /worker/proposals {
            if ($request_method != POST) { return 403; }
            if ($args != "") { return 403; }
            limit_req zone=proposals burst=10 nodelay;
            proxy_pass http://127.0.0.1:5188;
            proxy_set_header Host localhost;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_buffering off;
        }
        location / { return 403; }
    }
}
