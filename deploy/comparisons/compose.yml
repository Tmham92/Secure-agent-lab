x-worker: &worker
  build:
    context: ../..
    dockerfile: deploy/comparisons/Dockerfile
  network_mode: service:boundary
  depends_on:
    boundary: {condition: service_healthy}
  cap_drop: [ALL]
  read_only: true
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=8m,mode=1777", "/workspace:size=8m,mode=0700,uid=1654,gid=1654"]
  pids_limit: 64
  mem_limit: 192m
  cpus: 0.5
  command: [idle]
services:
  boundary:
    build:
      context: ../..
      dockerfile: deploy/comparisons/Boundary.Dockerfile
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: ["/ready:size=1m,mode=0755"]
    networks: [sealed]
    pids_limit: 8
    mem_limit: 32m
    cpus: 0.25
    healthcheck:
      test: [CMD, test, -f, /ready/installed]
      interval: 1s
      timeout: 1s
      retries: 20
  capture:
    <<: *worker
    user: "1656:1656"
    command: [server]
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:9000;http://127.0.0.1:5188
  relay:
    image: nginx:1.28-alpine
    network_mode: service:boundary
    depends_on:
      boundary: {condition: service_healthy}
    user: "1655:1655"
    entrypoint: [nginx, -g, "daemon off;"]
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    pids_limit: 16
    mem_limit: 32m
    cpus: 0.25
  unsafe:
    <<: *worker
    user: "1654:1654"
    volumes: ["${COMPARISON_FAKE_SECRET:?generated by launcher}:/fake/secret.txt:ro"]
  secure:
    <<: *worker
    user: "1657:1657"
    tmpfs: ["/tmp:size=8m,mode=1777", "/workspace:size=8m,mode=0700,uid=1657,gid=1657"]
networks:
  sealed:
    internal: true
